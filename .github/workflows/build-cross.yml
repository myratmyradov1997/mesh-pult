name: Build Cross-Platform MeshPult

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r cross-platform/requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --windowed --name MeshPult-Windows `
            --paths . `
            --add-data "mesh_automation_v3.py;." `
            --add-data "mesh_remote.py;." `
            cross-platform/mesh_pult_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeshPult-Windows
          path: dist/MeshPult-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tk
        run: sudo apt-get install -y python3-tk tk xvfb
      - name: Install deps
        run: |
          pip install -r cross-platform/requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --windowed --name MeshPult-Linux \
            --paths . \
            --add-data mesh_automation_v3.py:. \
            --add-data mesh_remote.py:. \
            cross-platform/mesh_pult_gui.py
          chmod +x dist/MeshPult-Linux
          tar -czf MeshPult-Linux.tar.gz -C dist MeshPult-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: MeshPult-Linux
          path: MeshPult-Linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MeshPult-Windows/MeshPult-Windows.exe
            MeshPult-Linux/MeshPult-Linux.tar.gz
